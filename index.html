<!DOCTYPE html>
<html lang="fr-CA">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CampusBooks — Livres usagés</title>
    <link rel="stylesheet" href="./css/styles.css">
    <script type="module" src="./js/app.js"></script>
</head>
<body>
    <header class="entete">
        <div class="conteneur">
            <a class="marque" href="./index.html">CampusBooks</a>
        </div>
    </header>

    <main class="conteneur catalogue">
        <div class="barre-catalogue">
            <h1>Livres usagés</h1>

            <div class="filtre-campus">
                <label for="campus">Filtrer par campus</label>
                <select id="campus" disabled>
                    <option value="">Tous les campus</option>
                </select>
            </div>
        </div>

        <p id="message-catalogue" role="status">Chargement des annonces…</p>
        <section id="annonces" class="grille-annonces" aria-label="Annonces"></section>
    </main>
</body>
</html>
